<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jom Calvin Dimla | Portfolio</title>
  <!-- Font Awesome for social and navigation icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body {
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.45)), url('https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 1.2rem;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      object-fit: cover;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .subtitle {
      color: #eab308; /* Yellow-gold highlight */
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 1.3rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Social Links */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .social-links a {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.4rem;
      transition: color 0.2s, transform 0.2s;
    }

    .social-links a:hover {
      color: #ffffff;
      transform: scale(1.15);
    }

    /* Menu Tabs */
    .menu-tabs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .menu-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .menu-btn.active {
      color: #eab308;
      border-color: rgba(234, 179, 8, 0.3);
    }

    .menu-btn:hover {
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
    }
