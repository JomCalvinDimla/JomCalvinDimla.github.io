<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jom Calvin Dimla | Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #2f81f7;
      margin-bottom: 1rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.4rem; }
    .subtitle { color: #58a6ff; font-weight: 600; margin-bottom: 1.2rem; font-size: 1.05rem; }
    .bio { color: #8b949e; line-height: 1.6; margin-bottom: 2rem; }
    .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      text-decoration: none;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-primary { background: #238636; color: #ffffff; }
    .btn-secondary { background: #1f6feb; color: #ffffff; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://github.com/JomCalvinDimla.png" alt="Jom Calvin Dimla" class="avatar" />
    <h1>Jom Calvin Dimla</h1>
    <p class="subtitle">BSIT Student • Aspiring Full Stack Developer</p>
    <p class="bio">
      Building my skills one project at a time, from a family computer shop to the code editor. Currently studying at National University Clark and learning Java.
    </p>
    <div class="btn-group">
      <a href="https://github.com/JomCalvinDimla" class="btn btn-secondary">👤 GitHub Profile</a>
      <a href="https://github.com/JomCalvinDimla?tab=repositories" class="btn btn-primary">📚 My Assignments & Repos</a>
    </div>
  </div>
</body>
</html>
